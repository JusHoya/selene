# Robot spawn poses.
#
# GEOMETRY: the fleet starts on the illuminated plain, OUTSIDE the PSR, within
# short range of the depot/recharge station at (-30, -100).
#
# The previous ring at (-70,-110)/(-80,-110)/(-65,-105)/(-75,-105) sat 44.7-57.0 m
# from the PSR centre (-100,-150), i.e. all four were INSIDE the 60 m radius. That
# was harmless only while the terrain was mirrored and the crater was rendering
# 300 m away; once the heightmap row order was fixed the fleet began inside the
# crater, and battery_node._is_in_psr() would report permanent shadow, so
# battery_node.py:162 ("in solar zone and stationary") could never recharge them.
#
# Every spawn below is:
#   - outside the 60 m PSR radius   -> gets solar recharge
#   - 14-21 m from the depot        -> short trip to recharge, clear of its 10 m radius
#   - >=13 m from the nearest rock in selene_agent/config/nav_params.yaml
#   - >=7 m from its neighbours     -> no spawn interpenetration
# Distances from the PSR centre: scout_01 79.9 m, scout_02 85.1 m,
# excavator_01 71.1 m, hauler_01 66.9 m. Depot distances 15.8-21.2 m.
#
# ---------------------------------------------------------------------------
# SPAWN HEIGHT. z is NOT a constant. Every value below is (measured collision
# surface at that exact XY) + 0.30 m, rounded to 10 mm.
#
# WHY. Until this commit all four spawns used z=1.5 with the comment "clears the
# +/-0.7 m plain undulation". The plain does not sit near 0 and it is not flat
# along x=-45. MEASURED collision surface (Gazebo Harmonic, gz-sim 8.11.0, real
# lunar_terrain, probe spheres pinned to a prismatic Z-only joint so they cannot
# roll off the sample point - see the note on check_terrain.sh below):
#
#     (-45, -85)  scout_02       +2.3840 m
#     (-45, -92)  scout_01       +2.4925 m
#     (-45,-105)  excavator_01   +4.0114 m
#     (-45,-112)  hauler_01      +5.2688 m
#     (-30,-100)  depot          +1.8051 m
#     (  0,   0)  origin         +0.6801 m
#     (-100,-150) PSR floor     -16.6025 m
#
# So x=-45 is not "low, flat ground": it climbs 2.88 m between y=-85 and y=-112
# because it lies on the OUTER FLANK of the PSR crater rim. At z=1.5 the scouts
# were ~1.0 m underground, the excavator ~2.5 m and the hauler ~3.8 m.
#
# MEASURED consequence of being underground, scout_01 at (-45,-92,1.5) on the
# real lunar_psr.sdf world, spawned through the same /world/<w>/create service
# simulation.launch.py uses, commanded linear.x=0.4 for 12 s:
#     settle  x=-45.000000 y=-92.000000 z=1.507770
#     after   x=-45.000000 y=-92.000000 z=1.523410
#     world displacement 0.0000 m, odometry 5.0820 m -> 100% slip
# X and Y identical to six decimals. The body is inside the heightfield, its
# horizontal DOFs held by contact, extruded upward at ~1 mm/s. The wheels turn
# at exactly the commanded 4.0 rad/s inside solid rock, so DiffDrive odometry -
# which integrates measured joint position - reads a perfectly plausible 5 m.
#
# Same world, same model, same command, ONLY z changed 1.5 -> 2.8:
#     settle  x=-44.998500 y=-91.998500 z=2.532000   (= surface 2.4925 + 0.04)
#     after   x=-48.272300 y=-95.364900 z=3.006700
#     world displacement 4.6958 m, odometry 4.6740 m -> slip -0.5%
# Verified the same way for hauler_01 at z=5.6 (4.4197 m world / 4.6065 m odom,
# 4.1% slip). Regression gate: scripts/check_drive.sh.
#
# The +0.30 m margin is deliberate: it is larger than the ~0.05 m of relief a
# 1.0 m wheelbase sees across the collision heightmap's 3.91 m cells, and small
# enough that the drop is harmless (0.26 m of free fall at 1.62 m/s^2 = 0.92 m/s
# impact). The robot then settles onto the surface; do not read these numbers as
# resting heights.
#
# WHY THE OLD NUMBER LOOKED SAFE. scripts/check_terrain.sh drops FREE spheres,
# and under lunar gravity on sloped ground they roll for tens of metres before
# they are sampled, so it reports the height wherever the probe stopped, not the
# height at the coordinate asked about. It also hard-codes placed_z=1.5 for the
# four spawns instead of reading this file. Both should be fixed there; until
# they are, treat check_terrain.sh as a burial *smoke* test only and treat
# scripts/check_drive.sh as the authority on whether a spawn is usable.
#
# UPSTREAM ROOT CAUSE, not fixed here (selene_sim/models/lunar_terrain/model.sdf
# and selene_sim/scripts/generate_heightmap.py are outside this change): gz-sim
# scales a heightmap so that the IMAGE'S OWN MAXIMUM PIXEL maps to <size> z, not
# so that the format maximum does. lunar_collision_129.png peaks at 204/255 and
# lunar_surface_513.png at 52980/65535, so the effective vertical scale is
# 30/(204/255) = 37.5 m, every elevation is inflated 25%, and the -18 m datum on
# terrain_link is ~4 m too low. Fixing the generator to emit full-range images
# would let the datum be honest and let these z values come back down; it would
# also remove the ~0.22 m collision-above-visual offset the two differing peaks
# create. Until then, spawn heights must be measured, not assumed.
#
# yaw -2.33 rad points each robot at the PSR centre, so the first navigation leg
# is roughly straight ahead.
scouts:
  - {x: -45, y: -92, z: 2.8, yaw: -2.33}    # surface +2.4925
  - {x: -45, y: -85, z: 2.7, yaw: -2.33}    # surface +2.3840
excavators:
  - {x: -45, y: -105, z: 4.3, yaw: -2.33}   # surface +4.0114
haulers:
  - {x: -45, y: -112, z: 5.6, yaw: -2.33}   # surface +5.2688
