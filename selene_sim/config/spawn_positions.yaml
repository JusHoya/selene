# Robot spawn poses.
#
# GEOMETRY: the fleet starts on the illuminated plain, OUTSIDE the PSR, within
# short range of the depot/recharge station at (-30, -100).
#
# The previous ring at (-70,-110)/(-80,-110)/(-65,-105)/(-75,-105) sat 44.7-57.0 m
# from the PSR centre (-100,-150), i.e. all four were INSIDE the 60 m radius. That
# was harmless only while the terrain was mirrored and the crater was rendering
# 300 m away; once the heightmap row order was fixed the fleet began inside the
# crater, and battery_node._is_in_psr() would report permanent shadow, so
# battery_node.py:162 ("in solar zone and stationary") could never recharge them.
#
# Every spawn below is:
#   - outside the 60 m PSR radius   -> gets solar recharge
#   - 14-21 m from the depot        -> short trip to recharge, clear of its 10 m radius
#   - >=13 m from the nearest rock in selene_agent/config/nav_params.yaml
#   - >=7 m from its neighbours     -> no spawn interpenetration
# Distances from the PSR centre: scout_01 79.9 m, scout_02 85.1 m,
# excavator_01 71.1 m, hauler_01 66.9 m. Depot distances 15.8-21.2 m.
#
# ---------------------------------------------------------------------------
# SPAWN HEIGHT. z is NOT a constant, and it is NOT a guess. Every value below is
#
#     (collision surface MEASURED at that exact XY by scripts/check_terrain.sh)
#     + 0.30 m, rounded UP to 10 mm
#
# Rounding up, not to nearest: rounding to nearest can land the margin under
# 0.30 m, and it silently did. The previous generation of these values was
# rounded to 100 mm and excavator_01 ended up at 4.30 against a 4.0114 m surface
# — a 0.2886 m margin, under the 0.30 the comment claimed.
#
# MEASURED collision surfaces (2026-07-30, Gazebo Harmonic / gz-sim 8.14.0,
# ROS 2 Jazzy, real lunar_terrain, probe spheres pinned to a prismatic Z-only
# joint so they cannot roll off the sample point):
#
#     (-45, -85)  scout_02       +1.340096 m   -> z 1.65
#     (-45, -92)  scout_01       +1.446014 m   -> z 1.75
#     (-45,-105)  excavator_01   +2.633854 m   -> z 2.94
#     (-45,-112)  hauler_01      +3.621368 m   -> z 3.93
#     (-30,-100)  depot          +0.886175 m   (see lunar_psr.sdf)
#     (-100,-150) PSR floor     -13.914932 m
#
# THESE NUMBERS MOVED, AND WHY. They are 0.94-1.66 m lower than the previous
# generation (2.7/2.8/4.3/5.6) because the heightmap normalisation bug was fixed
# in selene_sim/scripts/generate_heightmap.py. gz-sim scales a heightmap so the
# image's OWN brightest pixel maps to <size> z, not so the format maximum does;
# the generator assumed the latter, so every elevation was inflated by 1.2370
# (visual) / 1.2500 (collision) and the -18 m datum on terrain_link was
# cancelling that inflation. The generator now emits full-range images and
# declares each one's true metric height, terrain_link carries -15.0 (the +15 m
# base the generator actually adds), and world z is now exactly
# (metric height - 15.0). See the header of generate_heightmap.py.
#
# x=-45 is still not "low, flat ground": it climbs 2.28 m between y=-85 and
# y=-112 because it lies on the OUTER FLANK of the PSR crater rim. Do not
# collapse these four values back into one.
#
# MEASURED consequence of being underground — the failure this file exists to
# prevent — scout_01 at (-45,-92,1.5) on the real lunar_psr.sdf world under the
# OLD inflated terrain, spawned through the same /world/<w>/create service
# simulation.launch.py uses, commanded linear.x=0.4 for 12 s:
#     settle  x=-45.000000 y=-92.000000 z=1.507770
#     after   x=-45.000000 y=-92.000000 z=1.523410
#     world displacement 0.0000 m, odometry 5.0820 m -> 100% slip
# X and Y identical to six decimals. The body is inside the heightfield, its
# horizontal DOFs held by contact, extruded upward at ~1 mm/s. The wheels turn
# at exactly the commanded 4.0 rad/s inside solid rock, so DiffDrive odometry -
# which integrates measured joint position - reads a perfectly plausible 5 m.
# Regression gate: scripts/check_drive.sh, which asserts world displacement
# against the COMMAND and refuses to accept odometry as evidence.
#
# The +0.30 m margin is deliberate: it is larger than the ~0.05 m of relief a
# 1.0 m wheelbase sees across the collision heightmap's 3.91 m cells, and small
# enough that the drop is harmless (0.26 m of free fall at 1.62 m/s^2 = 0.92 m/s
# impact). The robot then settles onto the surface; do not read these numbers as
# resting heights.
#
# WHY YOU MUST RE-MEASURE RATHER THAN COMPUTE. A bilinear read of
# lunar_collision_129.png predicts these four surfaces as 1.3108 / 1.4199 /
# 2.4540 / 3.4121 — low by 0.026 m on the flattest point and by 0.209 m on the
# steepest. A 0.5 m probe sphere rests TANGENT to a sloped collision cell, so it
# reads high exactly where the ground is steep, and a wheel does the same thing.
# The gate's measurement is the reference; the PNG is not. If you regenerate the
# heightmap, re-run scripts/check_terrain.sh and copy the surface_z column here.
#
# yaw -2.33 rad points each robot at the PSR centre, so the first navigation leg
# is roughly straight ahead.
# FLEET SIZE. The first two scouts, first excavator and first hauler are the
# default 2/1/1 fleet. The rest exist so the fleet can actually be staged up to
# the ten robots NFR-1.1 and NFR-1.4 specify ("up to 10 robots"):
#     ros2 launch selene_sim unified_sim.launch.py \
#         num_scouts:=4 num_excavators:=3 num_haulers:=3
# simulation.launch.py takes the first N of each group and FAILS THE LAUNCH if
# N exceeds what is listed here, rather than inventing a pose — a guessed z puts
# the robot inside the terrain. Adding an eleventh means surveying it: put the
# coordinate in the POINTS list of scripts/check_terrain.sh, run it, and read
# surface_z.
#
# Every added pose was checked against the same constraints as the original four
# before being measured: outside the 60 m PSR radius (63.1-90.6 m), clear of the
# depot's 10 m radius (22.1-26.6 m), and >= 7.0 m from every other spawn.
# Surveyed 2026-07-30, same gate and same run as the four above.
scouts:
  - {x: -45, y: -92, z: 1.75, yaw: -2.33}   # surface +1.446014
  - {x: -45, y: -85, z: 1.65, yaw: -2.33}   # surface +1.340096
  - {x: -45, y: -78, z: 1.67, yaw: -2.33}   # surface +1.364892
  - {x: -52, y: -109, z: 4.14, yaw: -2.33}  # surface +3.835680
excavators:
  - {x: -45, y: -105, z: 2.94, yaw: -2.33}  # surface +2.633854
  - {x: -52, y: -88, z: 2.03, yaw: -2.33}   # surface +1.720789
  - {x: -52, y: -95, z: 2.48, yaw: -2.33}   # surface +2.176777
haulers:
  - {x: -45, y: -112, z: 3.93, yaw: -2.33}  # surface +3.621368
  - {x: -45, y: -119, z: 4.28, yaw: -2.33}  # surface +3.975844
  - {x: -52, y: -102, z: 3.46, yaw: -2.33}  # surface +3.158512
