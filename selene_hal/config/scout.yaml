robot_type: scout
kinematic_model: differential_drive
max_speed: 0.5
turn_radius: 0.0
mass: 50
battery:
  capacity: 50
  idle_draw: 10
  locomotion_draw: 150
sensors:
  - name: neutron_spectrometer
    type: scalar_field
    topic: sensors/neutron_spec
    frame: base_link
    range: 10.0
    noise_stddev: 0.5
    power_draw: 10
  - name: stereo_camera
    type: depth_image
    topic: sensors/depth
    frame: camera_link
    range: 20.0
    fov: 90
    resolution: [320, 240]
    power_draw: 8
  - name: imu
    type: imu
    topic: sensors/imu
    frame: base_link
    update_rate: 100
    power_draw: 1
  # WORLD-REFERENCED POSE, not Gazebo's raw dead-reckoned /odom.
  #
  # `odom` is published by ros_gz_bridge straight out of DiffDrive, which
  # integrates wheel encoders from a pose of (0,0,0) — so its origin is this
  # robot's SPAWN POSE and its x-axis is the spawn heading. Reading that as
  # world coordinates is register D-08: it mis-indexed the resource map, tested
  # solar shadow at the wrong place, and drove robots off the 500 m heightfield
  # until ODE aborted the simulator.
  #
  # `odom_world` is the same message with the spawn SE(2) applied, published by
  # selene_sim/selene_sim/world_odometry_node.py — the one conversion point in
  # the system. On real hardware this is the topic a localisation stack would
  # publish; the HAL is deliberately unaware of which produced it.
  #
  # The name is WORLD_ODOM_TOPIC in selene_sim/selene_sim/world_frame.py, and
  # selene_sim/test/test_sensor_topic_coverage.py cross-checks these RCDLs
  # against what selene_sim actually publishes, so the two cannot drift apart.
  - name: odometry
    type: odometry
    topic: odom_world
    frame: base_link
    update_rate: 20
    power_draw: 0
actuators: []
capabilities:
  - prospect
