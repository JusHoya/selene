name: SELENE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Dispatchable so this pipeline can be exercised on a feature branch BEFORE it
  # is merged. That is not hypothetical: this workflow has been red on main since
  # 2026-04-23, for three months, because the e2e job there installs `pytest`
  # without numpy and dies at collection — and `build-and-test` declares
  # `needs: e2e-integration`, so the whole pipeline goes with it. The fix is on
  # this branch and could not be verified before merging without this trigger.
  workflow_dispatch:

# ---------------------------------------------------------------------------
# KNOWN LIMITATION — ROS distro gap (unresolved, deliberately not papered over)
#
# `build-and-test` below builds and tests against ROS 2 **Humble** on Ubuntu
# 22.04 (image `ros:humble-ros-base-jammy`). The project's own tooling and docs
# target ROS 2 **Jazzy** on Ubuntu 24.04 (see scripts/setup_wsl2.sh and
# README.md), and commit 940f6f7 was specifically a Jazzy rclpy-executor fix.
#
# Consequence: the Jazzy code path — the one a live demo actually runs on — is
# NOT covered by CI. A green pipeline here does not mean the Jazzy build works.
#
# This was left as-is on purpose: switching the image to
# `ros:jazzy-ros-base-noble` could not be built or executed in the environment
# where this file was edited, so it would be an unvalidated change to the only
# job that currently builds the workspace. Adding a Jazzy job is the right fix
# and needs to be done by someone who can actually run it.
#
# PARTIAL EVIDENCE (2026-07-29): the workspace at commit a8d711a was built
# successfully under ROS 2 Jazzy on Ubuntu 24.04.3 (noble) — `colcon build` exit
# 0, all 6 packages, and `selene_msgs` imported with all 10 RobotState fields
# intact. So the Jazzy *build* is not believed to be the risk. That was a local
# WSL2 install of `ros-jazzy-desktop` plus the deps listed in the apt step below,
# NOT the `ros:jazzy-ros-base-noble` container this job would use, and Docker was
# unavailable — so a Jazzy CI job is still an unvalidated change and is still the
# right next step for whoever can run a container.
# ---------------------------------------------------------------------------

jobs:
  # Fast pure-Python E2E integration test — Phase 6 entry criterion.
  # Runs on every push/PR to block regressions in the coordination
  # layer (inject_task -> auction -> assignment -> inventory). No ROS
  # toolchain needed so it completes in well under a minute.
  e2e-integration:
    name: E2E integration test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # numpy is REQUIRED, not optional: test_e2e_integration.py imports
      # selene_orchestrator.orchestrator_node, which imports resource_map,
      # htn_planner and adaptive_survey — all three do `import numpy as np`.
      # A fresh setup-python container has no numpy, so `pip install pytest`
      # alone made this job fail at collection with
      #     ImportError: No module named 'numpy'
      # and, because build-and-test declares `needs: e2e-integration`, that
      # reddened the entire pipeline on every commit since c0aff23.
      #
      # numpy is the only third-party package this test's import graph needs:
      # verified locally by blocking scipy / pyyaml / pydantic / pandas in
      # sys.meta_path and re-running the test (3 passed), and by blocking
      # numpy alone (collection error, reproducing the CI failure exactly).
      - name: Install test dependencies
        run: pip install pytest numpy

      # Be explicit about import paths rather than relying on the interpreter
      # happening to have the right cwd on sys.path. There is no colcon
      # install in this job, so the parent directory of each Python package
      # has to be on PYTHONPATH. selene_orchestrator/test/conftest.py adds the
      # same two entries itself; keeping both means neither is load-bearing
      # alone.
      - name: Run E2E test
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/selene_orchestrator:${{ github.workspace }}/selene_isru
        run: |
          python -m pytest selene_orchestrator/test/test_e2e_integration.py -v

  # THE GATE LANE, run whole — deviation D-36's unclosed remainder.
  #
  # D-36 was: test_terrain_guard.py did a bare `from selene_agent.navigator import
  # OccupancyGrid` inside a test body, so the two-package invocation that
  # docs/phase5_deviation_register.md calls "THE GATE LANE" went
  #     1 failed, 518 passed
  # rather than skipping. The import is now an `importorskip` and the lane is
  # 518 passed / 1 skipped. What D-36 could NOT close is why nothing noticed for
  # two days, and that gap is this job.
  #
  # Every other Python lane in this file puts a DIFFERENT set of packages on
  # PYTHONPATH, and none of them is this one:
  #   e2e-integration      declares exactly this two-package path — and then names
  #                        ONE FILE, so it exercises about 3 of the 518 tests and
  #                        would not have touched test_terrain_guard.py at all;
  #   cross-package-tests  puts all FIVE packages on the path, which makes the
  #                        unguarded selene_agent import resolve, so the defect is
  #                        invisible there by construction;
  #   build-and-test       runs `colcon test`, which gives every package its own
  #                        process and its own environment.
  # So the exact command the register documents, and the one the operator runs by
  # hand, had no machine reading it. This job is that reading.
  #
  # It is deliberately the SAME dependency set as cross-package-tests, so that the
  # only variable between the two jobs is PYTHONPATH. If this lane goes red while
  # cross-package-tests stays green, the difference is a cross-package import that
  # is missing a guard — which is D-36's shape exactly, and the message below says
  # so to whoever reads the failure.
  #
  # D-14's rule was "do not add a test lane without a cross-package lane". Its
  # converse — a cross-package assertion needs a guard for the lanes that do not
  # span those packages — is D-36. Both rules now have a job behind them.
  gate-lane-tests:
    name: Gate lane pytest (orchestrator + isru only)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest numpy pyyaml pydantic pillow

      - name: Run the orchestrator and isru suites on the two-package path
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/selene_orchestrator:${{ github.workspace }}/selene_isru
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m pytest selene_orchestrator/test selene_isru/test -q; then
            echo "::error::The gate lane is red. If cross-package-tests is green, the"
            echo "::error::likely cause is a cross-package import with no importorskip"
            echo "::error::guard — that is deviation D-36. See docs/phase5_deviation_register.md."
            exit 1
          fi

  # The terrain datum, checked in pure Python — no Gazebo, no ROS, under a second.
  #
  # The relationship between a heightmap pixel and a world z is invisible from
  # every file that depends on it, and it has been wrong twice: once in row order
  # (the PSR crater rendered at (-100,+150) instead of (-100,-150)) and once in
  # vertical scale (gz-sim normalises a heightmap by the image's OWN maximum
  # pixel, not the format maximum, so a field peaking at 0.808 of full range came
  # out 1.24x too high and the -18 m datum existed to cancel that).
  #
  # Both were originally found by dropping probes in Gazebo, which needs WSL2 and
  # a built workspace and takes about a minute. This job asserts the same
  # invariants arithmetically on every push: that each PNG's brightest pixel is
  # exactly the format maximum, that model.sdf's three magic literals still match
  # heightmaps/terrain_datum.json, and that decoding the PNGs the way gz-sim does
  # reproduces world z = height - 15.0 with the crater on the southern side.
  # Verified to fail on all three real regressions, not just to pass today.
  #
  # The PHYSICAL gates live in .github/workflows/sim-gates.yaml. This job does not
  # replace them — it cannot tell you whether a robot can drive — it just makes the
  # arithmetic half cheap enough to run every time.
  terrain-datum:
    name: Terrain datum (no Gazebo)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pillow is REQUIRED: selene_sim/scripts/generate_heightmap.py does
      # `from PIL import Image`, and the test imports that module to obtain the
      # generator's field rather than re-implementing it. numpy for the field.
      - name: Install test dependencies
        run: pip install pytest numpy pillow

      - name: Check the terrain datum
        run: python -m pytest selene_sim/test/test_heightmap_datum.py -v

  # The Phase 5 exit gate's own coverage claim, checked in pure Python.
  #
  # Deviation D-10 is that scripts/validate_phase5.sh ran eight checks, passed
  # 8/8, and printed a report implying the Phase 5 exit gate had been met — while
  # three of the PRD's seven exit-gate rows had no check at all and the footer
  # asserting otherwise was a hand-written paragraph that had already gone
  # factually false about FR-MAP-4. Nothing connected the report to the checks.
  #
  # test_phase5_gate_coverage.py is that connection: it parses the exit-gate
  # table out of docs/PRD.md, the PRD_ROWS / ROW_CHECKS / CHECK_CATALOG mapping
  # out of scripts/validate_phase5.sh, and CHECK_TITLES out of
  # scripts/phase5_probe.py, and fails when they disagree. It is to D-10 what
  # test_no_orphan_parameters.py is to D-09.
  #
  # It is a job of its own rather than a line in `colcon test` for two reasons.
  # It needs NO dependencies at all — no ROS, no numpy, no pytest plugins, and it
  # imports nothing from selene_orchestrator — so it costs a few seconds. And
  # `colcon test` runs inside build-and-test, which declares
  # `needs: e2e-integration`; that job was red on main for three months, during
  # which every test it gates was silently skipped. A guard against a gate that
  # does not run must not itself be behind a gate that does not run.
  #
  # It does NOT run scripts/validate_phase5.sh. That needs Gazebo, rosbridge, npm
  # and a built Jazzy workspace, and sim-gates.yaml's own promotion criteria
  # stand at 1 of 10 green runs; a heavier job here would manufacture exactly the
  # false-green risk that file's header argues against.
  gate-coverage:
    name: Phase 5 gate coverage (no ROS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest

      - name: Check the exit gate's coverage mapping
        run: python -m pytest selene_orchestrator/test/test_phase5_gate_coverage.py -v

  # Every pure-Python package in ONE pytest process — deviation D-14.
  #
  # Nothing in this file used to do that, and the gap was not academic: for two
  # days the repository shipped a conftest whose ROS stubs were process-global,
  # and any single pytest run naming both selene_orchestrator/test and
  # selene_hal/test died at collection with
  #     ImportError: cannot import name 'ReliabilityPolicy' from 'rclpy.qos'
  # having run zero tests. CI stayed green throughout, because e2e-integration
  # runs one file, gate-coverage runs one file, terrain-datum runs one file, and
  # `colcon test` gives every package its own process. The defect was found by
  # hand, by running the command README.md documents.
  #
  # WHY THE MATRIX. Measured on the pre-fix conftest, on the same checkout:
  #   pytest 9.1.1 -> "Interrupted: 1 error during collection", 0 tests run
  #   pytest 7.4.4 -> test_gazebo_fill_level.py SKIPS and the run goes green
  # because pytest 8.2 added `importorskip(exc_type=...)` and 9.1 changed the
  # default from ImportError to ModuleNotFoundError. A single-version job would
  # have caught this defect on a developer's box and not in the container, or
  # the reverse. Both ends of the range this repo actually runs on are pinned
  # here for that reason.
  #
  # The `pytest<8` pin in build-and-test below is load-bearing for a different
  # reason (ros-humble-launch-testing's stale pytest_pycollect_makemodule hook
  # signature) and is NOT relaxed by this job: there is no launch_testing plugin
  # in a bare setup-python container, so the unpinned leg here cannot reach it.
  #
  # numpy is required for the same reason as in e2e-integration — resource_map,
  # htn_planner and adaptive_survey all `import numpy as np`. pyyaml is for the
  # RCDL descriptors selene_hal/selene_agent tests load, pydantic for the schema
  # that validates them, and pillow for selene_sim's heightmap test.
  #
  # Both orders are run because order-independence is a stated design guarantee
  # in README.md and the previous violation of it (an unrestored
  # `selene_isru.inventory.MaterialInventory` monkeypatch) was also invisible to
  # every per-package lane.
  cross-package-tests:
    name: Cross-package pytest (no ROS)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pytest_spec: ['pytest<8', 'pytest']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install "${{ matrix.pytest_spec }}" numpy pyyaml pydantic pillow

      - name: Report the pytest version under test
        run: python -m pytest --version

      - name: Run every package in one process, both orders
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/selene_orchestrator:${{ github.workspace }}/selene_isru:${{ github.workspace }}/selene_hal:${{ github.workspace }}/selene_agent:${{ github.workspace }}/selene_sim
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest selene_orchestrator/test selene_isru/test \
            selene_hal/test selene_agent/test selene_sim/test -q
          python -m pytest selene_sim/test selene_agent/test selene_hal/test \
            selene_isru/test selene_orchestrator/test -q

  # The dashboard, which NOTHING in this file used to read.
  #
  # That was a real hole, not an empty directory: selene_dashboard/ is ~4 kLOC
  # of JSX and is half of two Phase 5 deviations (D-15 the raster cache key,
  # D-16 the fleet-map label planner). The 39 jest tests added on 2026-07-31
  # under src/__tests__/ would have run nowhere.
  #
  # NO NEW DEPENDENCY IS INTRODUCED BY THIS JOB. jest 27 and jsdom ship inside
  # react-scripts@5.0.1, which is already a production dependency in
  # package.json, and `"test": "react-scripts test"` was already declared there.
  # The register's standing objection to a JavaScript test runner was that it
  # would put Node in front of the ORCHESTRATOR's Python lane; a job of its own,
  # with no `needs:`, does not — this can be red while every Python lane is
  # green, and vice versa.
  #
  # `--ext .js,.jsx` IS LOAD-BEARING AND IS NOT DECORATION. ESLint 8 lints only
  # `.js` by default, so `npx eslint src` — the command quoted as the dashboard
  # lint lane throughout the Phase 5 workstream — has never read a single file
  # in src/components/. Measured on 2026-07-31: with an unused import sitting in
  # ResourceLegend.jsx, `npx eslint src` reported clean and
  # `CI=true npx react-scripts build` failed on it.
  #
  # The build step is kept as well as the lint step, and is not redundant: CRA's
  # eslint-webpack-plugin runs `eslint-config-react-app` (not the repo's own
  # `extends: react-app`), which enables rules the bare CLI does not — react
  # hooks' exhaustive-deps and no-loop-func among them — and CI=true promotes
  # every warning to an error. It is also the only check that the bundle an
  # operator loads actually compiles.
  dashboard-tests:
    name: Dashboard lint, test and build (no ROS)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: selene_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: selene_dashboard/package-lock.json

      # `npm ci` (not `npm install`): it installs exactly package-lock.json and
      # fails if the lockfile and package.json disagree, so this job cannot
      # silently drift onto a different react-scripts than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Lint (including .jsx - see the note above)
        run: npx eslint --ext .js,.jsx src

      - name: Unit tests
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false

      - name: Production build
        env:
          CI: 'true'
        run: npx react-scripts build

  # Shell and workflow linting. Cheap, and this repo needs it more than most:
  # the two acceptance gates that decide whether a robot is buried are 700 lines
  # of bash, and the defects found in them have been shell defects — an unchecked
  # redirection that let a stale /tmp file be read as this run's measurement, a
  # `trap ... EXIT INT TERM` whose handler returned instead of exiting, a
  # `pkill -f` pattern that degenerated to `gz sim .*` when mktemp failed.
  # shellcheck would not have caught all of those, but it is the only automated
  # reader these files have ever had.
  #
  # actionlint checks the workflow SCHEMA (not just YAML syntax) and runs
  # shellcheck over every `run:` block. It immediately found an unquoted
  # $GITHUB_WORKSPACE in the build step below.
  shell-lint:
    name: Shell and workflow lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m755 /tmp/actionlint /usr/local/bin/actionlint
          shellcheck --version
          actionlint --version

      # -S warning, not -S style: the goal is defects, not house style. Every
      # tracked shell script is clean at this level today, so a new finding is a
      # real regression rather than pre-existing noise.
      #
      # WIDENED 2026-08-02, and the enumeration was replaced by a QUERY on
      # purpose. This step ran `shellcheck -S warning scripts/*.sh`, a
      # non-recursive glob that covered 13 files and silently missed the 14th --
      # docs/whitepapers/build.sh, which was linted by nothing and had accrued
      # two real defects: it hardcoded another developer's home directory, and
      # every pandoc call swallowed its exit status so the build could fail
      # fourteen times and still exit 0. A glob that names one directory cannot
      # notice a script added anywhere else, which is the same shape as D-38 (a
      # job that has never fired is not a check). `git ls-files` asks the
      # repository what shell scripts exist instead of asserting where they live,
      # so a script added in a new directory is covered the day it lands.
      # scripts/git-hooks/pre-push is named explicitly because it is
      # extensionless by necessity and no '*.sh' pattern can match it.
      #
      # PIPED THROUGH xargs -0, NOT AN UNQUOTED $( ), and that is not style.
      # The first version of this step ran `shellcheck ... $(git ls-files '*.sh')`
      # and turned this job RED on its first firing: actionlint shellchecks the
      # body of every `run:` block, and an unquoted command substitution is
      # SC2046 (word splitting). Quoting it would defeat the purpose -- the
      # point is to expand to many filenames -- so the list is passed as
      # NUL-delimited records instead, which also survives spaces in paths.
      # xargs appends them after the fixed arguments, so the hook is linted too.
      - name: shellcheck
        shell: bash
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning scripts/git-hooks/pre-push

      - name: actionlint
        shell: bash
        run: actionlint -no-color -oneline

  build-and-test:
    needs: e2e-integration
    runs-on: ubuntu-22.04
    # See the "ROS distro gap" note at the top of this file: this is Humble,
    # while the project targets Jazzy.
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-sensor-msgs \
            ros-humble-lifecycle-msgs \
            ros-humble-rosbridge-suite \
            ros-humble-std-msgs \
            ros-humble-visualization-msgs
          # Remove any apt-installed flake8 (which may bundle plugins like
          # flake8-docstrings/import-order/quotes) so the pip install below
          # gives us a deterministic plain flake8 environment.
          apt-get remove -y python3-flake8 flake8 || true
          # pillow is required by the `colcon test` step below, not by the build:
          # selene_sim/test/test_heightmap_datum.py imports
          # selene_sim/scripts/generate_heightmap.py, which does
          # `from PIL import Image`. Without it that test errors at collection and
          # reddens colcon test-result. (The dedicated terrain-datum job above
          # installs it too; neither is load-bearing alone.)
          # pytest is PINNED BELOW 8, and this is load-bearing. The container
          # ships ros-humble-launch-testing, whose pytest plugin still declares
          # the old `pytest_pycollect_makemodule(path, parent)` hook signature.
          # pytest 8 removed that `path` parameter, so an unpinned
          # `--upgrade pytest` installs 8.x into /usr/local, shadows the distro's
          # 7.x, and every colcon test invocation dies at startup with
          #     PluginValidationError: Plugin 'launch_testing' for hook
          #     'pytest_pycollect_makemodule'
          # before collecting a single test — measured, run 30570644912:
          # 5 packages, 5 errors, 0 failures, "test invocation failed without
          # generating a result file".
          #
          # This breakage was INVISIBLE until now. build-and-test declares
          # `needs: e2e-integration`, and that job has been red on main since
          # April for an unrelated missing-numpy reason, so this step was skipped
          # on every run and never reported. Fixing the first failure is what
          # uncovered the second.
          pip3 install --upgrade "pytest<8" flake8 numpy scipy pydantic pyyaml pillow

      - name: Build workspace
        shell: bash
        run: |
          mkdir -p /ros2_ws/src
          # Quoted: a checkout path containing a space would otherwise make this
          # `ln -s` create the wrong link, or two, and the build would then run
          # against an empty src tree. Flagged by actionlint/shellcheck SC2086.
          ln -s "$GITHUB_WORKSPACE" /ros2_ws/src/selene
          cd /ros2_ws
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+

      # Lint configuration lives in the repo's .flake8 file (max-line-length,
      # exclude list, extend-ignore = W503,W504) and is picked up automatically
      # because flake8 runs from the repo root. Only the extra build-artifact
      # exclusion and the output flags are passed here.
      #
      # `--select=E,W,F` used to be passed as well, and it made the CLI
      # contradict .flake8: an explicit --select replaces flake8's
      # extend-default-ignore set, so E121/E123/E126/E226/E24/E704 were
      # silently re-enabled (measured locally on this repo: 73 findings with
      # --select vs 34 without, the difference being 39 E704s). Note the
      # W503/W504 part of the original diagnosis did NOT reproduce on flake8
      # 7.3.0 — `--select=E,W,F --extend-ignore=W503,W504` does keep W503/W504
      # suppressed; it is the *default* ignore list that --select discards.
      # `--extend-exclude` (not `--exclude`) is used so the .flake8 exclude
      # list is extended rather than replaced.
      #
      # `scripts/` is in the target list as of 2026-07-30. It was not before,
      # and that was a real gap rather than an oversight about an empty
      # directory: scripts/phase5_probe.py — the measuring half of the Phase 5
      # exit gate (deviation D-10) — lives there, and it would otherwise be the
      # only unlinted Python in the repository. The shell half of that directory
      # is already covered by the shellcheck lane above, which globs
      # `scripts/*.sh`; between the two, nothing in scripts/ is now unread by a
      # machine.
      - name: Lint Python
        run: |
          python3 -m flake8 --version
          python3 -m flake8 selene_orchestrator/ selene_agent/ selene_hal/ selene_isru/ selene_sim/ \
            scripts/ \
            --extend-exclude='*.egg-info' \
            --show-source \
            --statistics \
            --count

      - name: Run tests
        shell: bash
        run: |
          cd /ros2_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
